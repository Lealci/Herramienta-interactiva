name: Validador de código
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  analizar_codigo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Analizar HTML (HTMLHint)
        run: npx htmlhint "**/*.html"

      - name: Analizar CSS (Stylelint)
        run: npx stylelint "**/*.css"
